name: 'Setup Development Environment'
description: 'Install Rust, mise, and development tools'

inputs:
  cache-key:
    description: 'Cache key suffix (e.g., "lint", "test", "android-aarch64")'
    required: false
    default: 'default'

runs:
  using: 'composite'
  steps:
    - name: Install mise
      shell: bash
      run: |
        curl https://mise.run | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH

    - name: Setup mise and tools
      shell: bash
      run: |
        mise trust
        mise install
        just setup

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ inputs.cache-key }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-${{ inputs.cache-key }}-cargo-

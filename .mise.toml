[tools]
# Rust toolchain (pinned version with components and Android targets)
rust = { version = "1.89.0", components = "rustfmt,clippy,rust-src" }

# Android NDK (for emulator tests in CI)
java = "17"

# Build tools
cmake = "4.2.3"
just = "1.46.0"
protoc = "33.5"
pipx = "1.7.1"
"pipx:pre-commit" = "4.5.1"


[env]
# Android NDK path (will be set by user's local setup)
# Example: ANDROID_NDK_HOME = "$HOME/Android/Sdk/ndk/26.4.10900000"
